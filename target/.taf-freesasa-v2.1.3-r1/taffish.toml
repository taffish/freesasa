[package]
name = "freesasa"
kind = "tool"
version = "2.1.3"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/freesasa"

[command]
name = "taf-freesasa"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/freesasa:2.1.3-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["structural-biology", "protein-structure", "surface-area", "solvent-accessibility"]
keywords = ["freesasa", "SASA", "solvent accessible surface area", "protein structure", "PDB", "mmCIF", "RSA", "JSON", "XML", "Lee Richards", "Shrake Rupley"]
description = "FreeSASA 2.1.3 command-line runtime and static C library for solvent accessible surface area calculations."

[upstream]
name = "FreeSASA"
type = "github"
repo = "mittinatten/freesasa"
homepage = "https://freesasa.github.io/"
manual = "https://freesasa.github.io/doxygen/CLI.html"
release_url = "https://github.com/mittinatten/freesasa/releases/tag/2.1.3"
downloads = "https://github.com/mittinatten/freesasa/archive/refs/tags/2.1.3.tar.gz"
version = "2.1.3"
commit = "ef5f27028447161bff0f2b67d05b74bb54c46eab"
license = "MIT; bundled Gemmi headers are MPL-2.0"
citation = "Mitternacht S. FreeSASA: An open source C library for solvent accessible surface area calculations. F1000Research. 2016;5:189."
doi = "10.12688/f1000research.7931.1"
watch = "tags"

[smoke]
backend = "docker"
timeout = 180
exist = ["freesasa", "grep", "sed", "ldd"]
test = ["grep -Fx \"FreeSASA 2.1.3\" /opt/freesasa/share/doc/freesasa/source.txt >/dev/null && grep -F \"dc4fe377352569299d69329d9ded2f141e527da325960b20d2e30b5335c2b3ff\" /opt/freesasa/share/doc/freesasa/source.txt >/dev/null && test -s /opt/freesasa/include/freesasa.h && test -s /opt/freesasa/lib/libfreesasa.a", "freesasa --version 2>&1 | grep -F \"FreeSASA 2.1.3\" >/dev/null && freesasa --help 2>&1 | grep -F \"Usage: freesasa\" >/dev/null && freesasa --help 2>&1 | grep -F -- \"--format=<log|res|seq|pdb|rsa|cif|xml|json>\" >/dev/null", "ldd \"$(command -v freesasa)\" 2>&1 | grep -F \"not found\" && exit 1 || true", "tmp=/tmp/taf-freesasa-pdb-smoke-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; freesasa --format=json --depth=atom -o \"$tmp/1ubq.json\" /opt/freesasa/share/testdata/1ubq.pdb >/dev/null; test -s \"$tmp/1ubq.json\"; grep -F '\"total\"' \"$tmp/1ubq.json\" >/dev/null; freesasa --select='ubiq, chain A' --format=seq -o \"$tmp/select.seq\" /opt/freesasa/share/testdata/1ubq.pdb >/dev/null; test -s \"$tmp/select.seq\"; grep -F 'SEQ A' \"$tmp/select.seq\" >/dev/null; rm -rf \"$tmp\"", "tmp=/tmp/taf-freesasa-cif-smoke-$$; rm -rf \"$tmp\"; mkdir -p \"$tmp\"; freesasa --cif --format=xml -o \"$tmp/1ubq.xml\" /opt/freesasa/share/testdata/1ubq.cif >/dev/null; test -s \"$tmp/1ubq.xml\"; grep -F '<results xmlns=\"http://freesasa.github.io/\"' \"$tmp/1ubq.xml\" >/dev/null; grep -F '<area total=' \"$tmp/1ubq.xml\" >/dev/null; rm -rf \"$tmp\""]
